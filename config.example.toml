# go-navidrome-tui 配置示例
# 首次启动会运行交互式登录向导；也可以把本文件复制到配置目录后手动编辑。
# Windows: %AppData%\navidrome-tui\config.toml
# Linux:   $XDG_CONFIG_HOME/navidrome-tui/config.toml
# macOS:   ~/Library/Application Support/navidrome-tui/config.toml
# 可用 NAVIDROME_TUI_CONFIG 指定其它路径，或用 NAVIDROME_TUI_URL / _USER / _PASSWORD 覆盖，
# 环境变量方式不会把密码写入磁盘，更安全。

active = "home"

[[servers]]
name = "home"
url = "http://localhost:4533"
username = "admin"
# 向导写入的是 "enc:<hex>"；这只是避免明文展示，并非加密。
password = "enc:70617373776f7264"
insecure = false

# [[servers]]
# name = "remote"
# url = "https://music.example.com"
# username = "alice"
# password = "enc:..."
# insecure = false

[theme]
# 内置：musicfox（默认，网易红）| aurora | dracula | nord | gruvbox | mono
name = "musicfox"
customPath = ""

[keybindings]
useDefaultKeyBindings = true

[keybindings.app]
# 值可以是单个键，也可以是键数组；空字符串表示取消该操作的绑定。
# next = ["alt+n", "n"]
# help = ["?", "ctrl+h"]
# switchTheme = "t"
# intelligence = ""

[player]
# 留空自动从 PATH 查找 mpv；也可填写绝对路径。
mpvPath = ""
volume = 80
# sequential | loopAll | loopOne | shuffle
mode = "sequential"
socketName = "ndtui-mpv"

[cache]
ttl = "5m"
size = 512
pageSize = 60
coverCacheSize = 64

[ui]
# 默认开启：向导输入框/按钮可点击，主界面可点选菜单/队列行、滚轮浏览。
# 若终端把鼠标事件解析成异常字符，或偶发出现「按键全部无响应」，可设为 false
# （仍可用键盘全量操作）。程序默认已关闭 bracketed paste 以规避转义序列残留。
enableMouse = true
showCover = true
doubleColumn = true
# 克制动效：复用 500ms tick 的进度呼吸光、状态图标交替与 toast 淡出；设为 false 则完全静态。
animations = true
trueColor = true
coverWidth = 26
compactWidth = 60
# 封面渲染：text（默认，半块字符，任何终端都能显示）| sixel（显式开启，需图形终端）
# 排查顺序（同一个终端窗口里执行）：
#   1. `chafa -f sixel <图片>` 能出图 → 终端本身支持 Sixel。注意默认的 `chafa <图片>`
#      用的是半块字符，看起来有图也不能证明支持 Sixel。
#   2. `ndtui --sixel-check` → 会向终端查询 DA1（属性 4 = Sixel）与字符格像素尺寸，
#      再打印两张对照图：手写品红块（公认正确）与程序编码器生成的渐变图。
#      两张都出＝终端与编码器都正常；只出品红块＝编码器输出被拒（可用
#      `ndtui --sixel-dump sixel.txt` 导出载荷与 chafa 对比）；两张都不出＝当前窗口不渲染 Sixel。
#      WT_SESSION / TERM 只作日志参考：nushell、IDE 内置终端常常不转发它们。
# 设为 sixel 后终端环境变量只写日志提示，不会自动回退（stdout 重定向到文件除外）
coverProtocol = "text"
# Sixel 按像素绘制，这两个值用于把字符格换算成像素。--sixel-check 会报告终端实测的
# 字符格像素，按它填最准；不符合时图片会溢出占位区或被裁切。
sixelCellWidth = 8
sixelCellHeight = 16
# Sixel 调色板颜色数（2-256，默认 256）。调色板按封面自身颜色自适应生成，并做
# Floyd-Steinberg 抖动；调低会牺牲细腻度换取更小的传输量，一般不用改。
sixelColors = 256

[lastfm]
enabled = false
apiKey = ""
apiSecret = ""
sessionKey = ""
# 播放进度达到该百分比即上报（0 表示仅在结束时上报）
scrobbleAt = 50

[log]
# debug | info | warn | error，只写文件，不污染 TUI
level = "warn"
file = ""
